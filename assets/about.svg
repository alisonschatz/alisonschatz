  <text x="32" y="40" class="mono" font-size="12" fill="#8b949e" letter-spacing="2">01 · SOBRE MIM</text>

  <text x="32" y="80" class="sans" font-size="15" fill="#c9d1d9">Sou QA e escrevo a maior parte dos meus testes com Playwright e Cypress.</text>
  <text x="32" y="108" class="sans" font-size="15" fill="#c9d1d9">No dia a dia, testo APIs, coloco as suítes para rodar no CI e acompanho performance com k6.</text>
  <text x="32" y="136" class="sans" font-size="15" fill="#c9d1d9">Também programo front-end com Vue e TypeScript, o que me ajuda bastante na hora de testar.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <rect x="1" y="1" width="838" height="208" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="24" r="5" fill="#30363d"/>
  <circle cx="42" cy="24" r="5" fill="#30363d"/>
  <circle cx="60" cy="24" r="5" fill="#30363d"/>
  <line x1="1" y1="46" x2="839" y2="46" stroke="#21262d"/>

  <text x="40" y="82" class="mono" font-size="14" fill="#8b949e"><tspan fill="#3fb950">$</tspan> npx playwright test --project=alison<tspan class="cursor" fill="#e6edf3"> _</tspan></text>

  <text x="40" y="132" class="sans" font-size="38" font-weight="700" fill="#e6edf3">Alison Schatz</text>
  <text x="40" y="166" class="sans" font-size="17" fill="#8b949e">QA Automation Engineer  ·  Front-End Developer</text>

  <circle cx="676" cy="160" r="5" fill="#3fb950" class="pulse"/>
  <text x="690" y="165" class="mono" font-size="13" fill="#3fb950">all checks passed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .box { fill: #161b22; stroke: #30363d; }
    .flow { stroke: #3fb950; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
  </style>
  <rect x="1" y="1" width="838" height="228" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#8b949e" letter-spacing="2">03 · COMO EU TRABALHO</text>

  <line class="flow" x1="200" y1="118" x2="228" y2="118"/>
  <line class="flow" x1="420" y1="118" x2="448" y2="118"/>
  <line class="flow" x1="640" y1="118" x2="668" y2="118"/>

  <g transform="translate(32,70)">
    <rect class="box" width="168" height="130" rx="10"/>
    <text x="18" y="30" class="mono" font-size="12" fill="#3fb950">01</text>
    <text x="18" y="56" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Entender</text>
    <text x="18" y="82" class="sans" font-size="13" fill="#8b949e">Contrato OpenAPI,</text>
    <text x="18" y="100" class="sans" font-size="13" fill="#8b949e">regras de negócio</text>
    <text x="18" y="118" class="sans" font-size="13" fill="#8b949e">e cenários de risco</text>
  </g>
  <g transform="translate(232,70)">
    <rect class="box" width="188" height="130" rx="10"/>
    <text x="18" y="30" class="mono" font-size="12" fill="#3fb950">02</text>
    <text x="18" y="56" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Automatizar</text>
    <text x="18" y="82" class="sans" font-size="13" fill="#8b949e">E2E com Playwright</text>
    <text x="18" y="100" class="sans" font-size="13" fill="#8b949e">e Cypress, API com</text>
    <text x="18" y="118" class="sans" font-size="13" fill="#8b949e">Postman e Bruno</text>
  </g>
  <g transform="translate(452,70)">
    <rect class="box" width="188" height="130" rx="10"/>
    <text x="18" y="30" class="mono" font-size="12" fill="#3fb950">03</text>
    <text x="18" y="56" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Integrar</text>
    <text x="18" y="82" class="sans" font-size="13" fill="#8b949e">Suítes rodando no</text>
    <text x="18" y="100" class="sans" font-size="13" fill="#8b949e">GitHub Actions e no</text>
    <text x="18" y="118" class="sans" font-size="13" fill="#8b949e">Azure DevOps</text>
  </g>
  <g transform="translate(672,70)">
    <rect class="box" width="136" height="130" rx="10"/>
    <text x="18" y="30" class="mono" font-size="12" fill="#3fb950">04</text>
    <text x="18" y="56" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Medir</text>
    <text x="18" y="82" class="sans" font-size="13" fill="#8b949e">Carga e</text>
    <text x="18" y="100" class="sans" font-size="13" fill="#8b949e">performance</text>
    <text x="18" y="118" class="sans" font-size="13" fill="#8b949e">com k6</text>

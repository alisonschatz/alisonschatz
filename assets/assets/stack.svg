  <g transform="translate(32,172)">
    <rect class="chip" width="112" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#3178C6"/><text class="t" x="28" y="20">TypeScript</text>
    <g transform="translate(122,0)"><rect class="chip" width="112" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#F7DF1E"/><text class="t" x="28" y="20">JavaScript</text></g>
    <g transform="translate(244,0)"><rect class="chip" width="84" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#4FC08D"/><text class="t" x="28" y="20">Vue.js</text></g>
    <g transform="translate(338,0)"><rect class="chip" width="92" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#339933"/><text class="t" x="28" y="20">Node.js</text></g>

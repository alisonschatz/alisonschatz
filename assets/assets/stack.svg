<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .chip { fill: #161b22; stroke: #30363d; }
    .t { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #c9d1d9; }
  </style>
  <rect x="1" y="1" width="838" height="298" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#8b949e" letter-spacing="2">02 · STACK</text>

  <!-- QA -->

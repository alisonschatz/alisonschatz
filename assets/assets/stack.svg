  <text x="808" y="80" class="mono" font-size="12" fill="#3fb950" text-anchor="end">6 passed</text>
  <g transform="translate(32,94)">
    <rect class="chip" width="112" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#2EAD33"/><text class="t" x="28" y="20">Playwright</text>
    <g transform="translate(122,0)"><rect class="chip" width="90" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#69D3A7"/><text class="t" x="28" y="20">Cypress</text></g>
    <g transform="translate(222,0)"><rect class="chip" width="90" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#FF6C37"/><text class="t" x="28" y="20">Postman</text></g>
    <g transform="translate(322,0)"><rect class="chip" width="76" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#FFD43B"/><text class="t" x="28" y="20">Bruno</text></g>
    <g transform="translate(408,0)"><rect class="chip" width="58" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#7D64FF"/><text class="t" x="28" y="20">k6</text></g>
    <g transform="translate(476,0)"><rect class="chip" width="68" height="30" rx="15"/><circle cx="16" cy="15" r="4" fill="#C21325"/><text class="t" x="28" y="20">Jest</text></g>
  </g>

  <!-- Dev -->
  <text x="32" y="158" class="sans" font-size="15" font-weight="600" fill="#e6edf3">Desenvolvimento</text>
